name: app
description: "Baya mobile client for computers running the standalone Baya host."
publish_to: "none"
version: 1.3.4+83

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  lucide_icons_flutter: ^3.1.14+2
  cryptography: ^2.7.0
  mobile_scanner: ^7.4.3
  flutter_secure_storage: ^11.2.0
  web_socket_channel: ^3.0.1
  go_router: ^18.1.2

  # baya://pair links open the app straight into pairing.
  app_links: ^7.2.0

  # Material You: wallpaper-derived color schemes on Android 12+.
  dynamic_color: ^1.7.0

  # State: ChangeNotifier view models exposed through provider.
  provider: ^6.1.2

  # Local session cache (per-peer chat history). hive_ce is the maintained
  # continuation of hive 2 and reads the same on-disk format.
  hive_ce: ^2.11.0
  hive_ce_flutter: ^2.3.0

  # Owner-key persistence through Android Block Store. Local path dependency.
  baya_identity:
    path: packages/baya_identity

  # HTTP client for relay mesh metadata and the GitHub release feed.
  http: ^1.6.0

  # On-device speech-to-text for voice input.
  speech_to_text: ^7.5.0

  # Deep-link to Android settings when microphone permission is denied.
  app_settings: ^9.0.1

  # Image attachments compressed on device before upload.
  image_picker: ^1.2.4
  flutter_image_compress: ^2.5.1

  # Markdown rendering and external links.
  gpt_markdown: ^1.1.7
  url_launcher: ^6.3.3

  # Read the installed version for the Android update channel.
  package_info_plus: ^10.2.2
dev_dependencies:
  flutter_test:
    sdk: flutter

  fake_async: ^1.3.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/GeistMono/OFL.txt
    - assets/fonts/PinyonScript/OFL.txt

  # Unmodified upstream static fonts; sources and checksums in assets/fonts.
  fonts:
    - family: Pinyon Script
      fonts:
        - asset: assets/fonts/PinyonScript/PinyonScript-Regular.ttf
    - family: Geist Mono
      fonts:
        - asset: assets/fonts/GeistMono/GeistMono-Regular.ttf
        - asset: assets/fonts/GeistMono/GeistMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/GeistMono/GeistMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/GeistMono/GeistMono-Italic.ttf
          style: italic
