name: app
description: "Baya mobile client for computers running the standalone Baya host."
publish_to: "none"
version: 2.54.0+153

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  lucide_icons_flutter: ^4.0.2
  cryptography: ^2.7.0
  mobile_scanner: ^7.5.0
  flutter_secure_storage: ^11.2.0
  web_socket_channel: ^3.0.1
  go_router: ^18.1.3

  # baya://pair links open the app straight into pairing.
  app_links: ^7.2.0


  # State: ChangeNotifier view models exposed through provider.
  provider: ^6.1.2


  # Owner-key persistence through Android Block Store. Local path dependency.
  baya_identity:
    path: packages/baya_identity

  # HTTP client for Tailscale pairing and the GitHub release feed.
  http: ^1.6.0

  # On-device speech-to-text for voice input.
  speech_to_text: ^7.5.0

  # Deep-link to Android settings when microphone permission is denied.
  app_settings: ^9.0.1

  # Image attachments compressed on device before upload.
  image_picker: ^1.2.4
  flutter_image_compress: ^2.5.1

  # Markdown rendering and external links.
  gpt_markdown: ^1.4.1
  url_launcher: ^6.3.3

  # Where the crash log is kept.
  path_provider: ^2.1.6

  # Read the installed version for the Android update channel.
  package_info_plus: ^10.2.2
  re_highlight: ^0.0.3
  file_picker: ^13.3.2
  share_plus: ^13.3.1
  video_player: ^2.14.1
  flutter_svg: ^2.3.2
  # The terminal engine: Ghostty's libghostty-vt (MIT), prebuilt per ABI.
  libghostty: ^0.0.13
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  fake_async: ^1.3.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/Inter/OFL.txt
    - assets/fonts/JetBrainsMono/OFL.txt
    - assets/fonts/PinyonScript/OFL.txt
    - assets/fonts/SymbolsNerdFont/LICENSE

  # Unmodified upstream static fonts; sources and checksums in assets/fonts.
  fonts:
    - family: Pinyon Script
      fonts:
        - asset: assets/fonts/PinyonScript/PinyonScript-Regular.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Regular.ttf
        - asset: assets/fonts/Inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter-Bold.ttf
          weight: 700
    # Prompt and TUI icons (Powerline, Nerd Font) in terminals.
    - family: Symbols Nerd Font Mono
      fonts:
        - asset: assets/fonts/SymbolsNerdFont/SymbolsNerdFontMono-Regular.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Italic.ttf
          style: italic
