name: baya_identity
description: >-
  Android Block Store persistence for Baya's synchronized Owner Ed25519 key.
version: 0.2.1
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.wianger.baya.identity
        pluginClass: BayaIdentityPlugin
