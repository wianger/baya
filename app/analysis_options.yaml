analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**

include: package:flutter_lints/flutter.yaml

# On top of flutter_lints: rules that catch bugs (lost futures, leaked
# streams, dynamic calls) and keep the code uniform. `dart fix --apply`
# settles most of the style ones.
linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_redundant_argument_values
    - cancel_subscriptions
    - close_sinks
    - comment_references
    - directives_ordering
    - only_throw_errors
    - prefer_const_constructors
    - prefer_final_in_for_each
    - prefer_final_locals
    - test_types_in_equals
    - unawaited_futures
    - unnecessary_lambdas
    - unnecessary_statements
    - use_super_parameters
