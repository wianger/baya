name: App release

# Tag app-v<version>+<build> (matching app/pubspec.yaml) to build the signed
# APK and publish it. Needs the release key as repository secrets:
# ANDROID_KEYSTORE (the .jks, base64), ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
on:
  push:
    tags:
      - "app-v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      CERTIFICATE_SHA256: bdaba7b38a226cf6bcf2673d24a8f56453ffdce66f3b3402e48e0bca7b884eaa
    steps:
      - name: Not released yet
        id: fresh
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The Windows release script publishes on its own; nothing to do then.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Already released."; echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.fresh.outputs.go == 'true'
      - name: Version matches the tag
        if: steps.fresh.outputs.go == 'true'
        run: |
          expected="${GITHUB_REF_NAME#app-v}"
          actual="$(sed -n 's/^version: *//p' pubspec.yaml)"
          test "$expected" = "$actual" || { echo "Tag $expected, pubspec $actual"; exit 1; }
      - uses: subosito/flutter-action@v2
        if: steps.fresh.outputs.go == 'true'
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - uses: actions/setup-java@v6
        if: steps.fresh.outputs.go == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - name: Release key
        if: steps.fresh.outputs.go == 'true'
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE" || { echo "The release key secrets are missing."; exit 1; }
          # Secrets set from a Windows pipe may end in CR/LF.
          clean() { printf %s "$1" | tr -d '\r\n'; }
          ANDROID_KEYSTORE_PASSWORD="$(clean "$ANDROID_KEYSTORE_PASSWORD")"
          ANDROID_KEY_ALIAS="$(clean "$ANDROID_KEY_ALIAS")"
          ANDROID_KEY_PASSWORD="$(clean "$ANDROID_KEY_PASSWORD")"
          clean "$ANDROID_KEYSTORE" | tr -d ' ' | base64 --decode > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<PROPS
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          PROPS
      - if: steps.fresh.outputs.go == 'true'
        run: flutter pub get
      - if: steps.fresh.outputs.go == 'true'
        run: flutter build apk --release --target-platform android-arm64
      - name: Check the signature and version
        if: steps.fresh.outputs.go == 'true'
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$tools/apksigner" verify --print-certs "$apk" | grep -qi "SHA-256 digest: $CERTIFICATE_SHA256" \
            || { echo "Not signed with the release key."; exit 1; }
          version="${GITHUB_REF_NAME#app-v}"
          "$tools/aapt2" dump badging "$apk" | grep -q "versionCode='${version#*+}' versionName='${version%+*}'" \
            || { echo "APK version differs from $version."; exit 1; }
          mkdir -p "$RUNNER_TEMP/out"
          cp "$apk" "$RUNNER_TEMP/out/Baya-Android.apk"
          (cd "$RUNNER_TEMP/out" && sha256sum Baya-Android.apk > SHA256SUMS.txt)
      - uses: actions/attest-build-provenance@v2
        if: steps.fresh.outputs.go == 'true'
        with:
          subject-path: ${{ runner.temp }}/out/Baya-Android.apk
      - name: Publish
        if: steps.fresh.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#app-v}"
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/out/Baya-Android.apk" "$RUNNER_TEMP/out/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" --prerelease --verify-tag \
            --title "Baya Android ${version%+*} (${version#*+})" --generate-notes
