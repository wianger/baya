name: Host binaries

# Single-file `baya` executables for every platform. Tag `host-v<version>`
# to publish them as a release; run by hand to just build them.
on:
  push:
    tags:
      - "host-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - macos-latest
          - macos-15-intel
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: host/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: host/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build:binary
      - run: ./build/bin/baya-* --version
        shell: bash
      - uses: actions/upload-artifact@v5
        with:
          name: baya-${{ matrix.os }}
          path: host/build/bin/*

  release:
    if: startsWith(github.ref, 'refs/tags/host-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: bin
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd bin
          sha256sum baya-* > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" baya-* SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "Baya host ${GITHUB_REF_NAME#host-v}" \
            --notes "Single-file Baya host. Download the one for your computer, make it executable, and run \`baya\`."
